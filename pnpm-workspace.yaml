packages:
  - apps/*
  - packages/*
  - lab/harness
  - lab/facilitator

# @x402/svm pulls @solana-program/token-2022, whose @solana/sysvars ^5 peer is
# otherwise unmet; pin the version @solana/kit 5.1.0 already uses.
packageExtensions:
  '@x402/svm@2.28.0':
    dependencies:
      '@solana/sysvars': 5.1.0

# Local patches (policy in AGENTS.md). @x402/svm 2.28.0: the upto scheme reads a
# multi-recipient channel distribution from extra.splits so the protocol fee is
# split on chain (x402-upto-metered); not yet proposed upstream. Remove when an
# @x402/svm release supports it.
patchedDependencies:
  '@x402/svm@2.28.0': patches/@x402__svm@2.28.0.patch

# Core 2.29 updates its schemas to the fixed Zod 4 API. Retain SVM 2.28 and its
# Solana 5 peer contract/local split patch; SVM 2.29 requires a separate Solana 8
# migration. Verify the mixed minor versions with the offline payment contracts.
overrides:
  '@x402/svm@2.28.0>@x402/core': 2.29.0
