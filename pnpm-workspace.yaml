packages:
  - apps/*
  - packages/*
  - lab/harness

# @x402/svm pulls @solana-program/token-2022, whose @solana/sysvars ^5 peer is
# otherwise unmet; pin the version @solana/kit 5.1.0 already uses.
packageExtensions:
  '@x402/svm@2.28.0':
    dependencies:
      '@solana/sysvars': 5.1.0

# Local patches (policy in AGENTS.md). @x402/svm 2.28.0: the upto scheme reads a
# multi-recipient channel distribution from extra.splits so the protocol fee is
# split on chain (x402-upto-metered); that part is not yet proposed upstream. It also lets a
# batch-settlement channel commit extra.splits at open, with the client's explicit
# approveSplits (proposed upstream: x402-foundation/x402#4166). Remove when an
# @x402/svm release supports both. Also adds allowClosingClaims (not yet proposed
# upstream), opt-in only on the upto claim path: native settle_and_seal accepts
# Closing before grace expires. Default/deposit validation stays Open-only.
# Reusable client-signed sessions additionally opt in to a zero first charge,
# with a zero voucher; upstream not yet proposed. Default positive-charge
# validation and the program stay unchanged. Remove when upstream supports it.
patchedDependencies:
  '@x402/svm@2.28.0': patches/@x402__svm@2.28.0.patch

# Core 2.29 updates its schemas to the fixed Zod 4 API. Retain SVM 2.28 and its
# Solana 5 peer contract/local split patch; SVM 2.29 requires a separate Solana 8
# migration. Verify the mixed minor versions with the offline payment contracts.
overrides:
  '@x402/svm@2.28.0>@x402/core': 2.29.0
  # @opennextjs/cloudflare (explorer build only) pulls @node-minify/core, which pins glob 10.3.3
  # (GHSA-5j98-mcp5-4vw2, a CLI command injection); 10.5.0 is the patched release of the same line.
  # Remove when @node-minify/core allows it.
  '@node-minify/core>glob': 10.5.0
  # drizzle-orm's optional @opentelemetry/api peer: one copy (the root's 1.9.0), so the apps' schemas
  # and the root tests share one drizzle-orm instance (two copies break the typecheck). Otherwise
  # any lockfile update re-resolves the apps' peer to 1.10.0. Remove when nothing pins 1.9.0.
  'drizzle-orm>@opentelemetry/api': 1.9.0
