#:schema ../packages/node/schemas/gyblos.schema.json
# (The #:schema path above is relative to this repository; in a copy elsewhere, update or delete it.)
# Give tokens away on devnet. A free offer has no price and must set both caps.
# A valid file, but the seller daemon refuses host.docker.internal today: its Ollama engine accepts only
# literal loopback URLs (127.0.0.1 or [::1]). examples/seller-daemon.toml is the file it serves.

version = 1

[node]
network = "devnet"
data_dir = "/data"

[discovery]
# Publication lists this node in the public discovery index. It stays off in this example so a quick
# test node is not advertised by accident; set publish = true (or GYBLOS_DISCOVERY_PUBLISH=1) to list it.
publish = false
url = "https://discovery.gyblos.com/v1"

[[offers]]
model = "qwen3:0.6b"              # alias of the catalog id qwen3-0.6b; tiny, good for quick tests
reasoning = ["off", "high"]       # Qwen3 thinking is on/off (GYB-DOC-028)
engine = { kind = "ollama", url = "http://host.docker.internal:11434" }
free = { daily_token_cap = 200000, per_buyer_cap = 5000 }
