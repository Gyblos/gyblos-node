#:schema ../packages/node/schemas/gyblos.schema.json
# (The #:schema path above is relative to this repository; in a copy elsewhere, update or delete it.)
# Resell a model from any OpenAI-compatible API. The API key stays in the environment:
#   export UPSTREAM_API_KEY=...
# A reseller URL earns the "declared usage" badge, and reselling may break the provider's terms;
# that is the seller's responsibility.

version = 1

[node]
network = "devnet"

[relays]
urls = ["https://na1.relay.gyblos.com"]
relay_token_env = "GYBLOS_RELAY_TOKEN"   # the variable's name, never the token itself

[[offers]]
model = "gpt-oss-20b"
reasoning = ["low", "medium", "high"]   # gpt-oss effort levels; it has no "off"
engine = { kind = "openai", url = "https://api.example.com/v1", api_key_env = "UPSTREAM_API_KEY", upstream_model = "gpt-oss-20b" }
price = { input_per_mtok = "0.08", output_per_mtok = "0.3", currency = "USDC" }
