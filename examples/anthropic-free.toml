#:schema ../packages/node/schemas/gyblos.schema.json
# (The #:schema path above is relative to this repository; in a copy elsewhere, update or delete it.)
# Give away a model from the Anthropic API (or a compatible one), capped per day and per buyer. The URL is
# the API root, without /v1, and the API key stays in the environment:
#   export ANTHROPIC_API_KEY=...
# Usage is declared by the provider ("Uso declarado"), and reselling may break the provider's terms;
# that is the seller's responsibility. Check it with `pnpm gyblos doctor --online`.

version = 1

[node]
network = "devnet"

[[offers]]
model = "acme/claude-chat"
custom = true
reasoning = ["off"]
engine = { kind = "anthropic", url = "https://api.anthropic.com", api_key_env = "ANTHROPIC_API_KEY", upstream_model = "claude-sonnet-4-5", context_tokens = 200000 }
free = { daily_token_cap = 200000, per_buyer_cap = 50000 }
