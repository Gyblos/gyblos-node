#:schema ../packages/node/schemas/gyblos.schema.json
# (The #:schema path above is relative to this repository; in a copy elsewhere, update or delete it.)
# Sell a model served by LM Studio's OpenAI-compatible server (default port 1234).
# LM Studio needs no API key locally, so api_key_env is omitted.

version = 1

[node]
network = "devnet"

[[offers]]
model = "gpt-oss-20b"
# gpt-oss has low, medium and high reasoning effort and no "off"; list the ones you are willing to serve.
reasoning = ["low", "medium", "high"]
engine = { kind = "openai", url = "http://127.0.0.1:1234/v1", upstream_model = "openai/gpt-oss-20b", context_tokens = 131072 }
price = { input_per_mtok = "0.05", output_per_mtok = "0.2", currency = "USDC" }
