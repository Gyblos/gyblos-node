# Dispatch on main only. The exact dispatch SHA, model and invocation budget are recorded.
name: AI security baseline
on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Exact openai/<model-id> in Pi'
        required: true
        type: string
      max_calls:
        description: 'Maximum Pi invocations including both verification passes'
        default: '300'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ai-security-baseline
  cancel-in-progress: false
jobs:
  baseline:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - name: Install trusted tooling without lifecycle scripts
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          npm ci --prefix tooling/security-review/runtime --ignore-scripts --no-audit --no-fund
      - name: Run source baseline
        env:
          PI_MODEL: ${{ inputs.model }}
          MAX_CALLS: ${{ inputs.max_calls }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PI_COMMAND: ${{ github.workspace }}/tooling/security-review/runtime/node_modules/.bin/pi
        run: |
          test -n "$OPENAI_API_KEY"
          pnpm security-review run baseline --output "$RUNNER_TEMP/ai-review" --max-calls "$MAX_CALLS"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ai-security-baseline-${{ github.sha }}
          path: ${{ runner.temp }}/ai-review
          if-no-files-found: error
          retention-days: 7
