# Builds the unsigned desktop app for macOS arm64, Windows x64 and Linux x64 (scripts in apps/desktop),
# starts each package on its own OS in --smoke mode (temporary profile, no wallet; it proves the window
# and the native iroh binding load), and keeps them as workflow artifacts. Run it by hand (Actions >
# Desktop packages > Run workflow) to try a build; the release workflow calls it with the tag, and then
# it also attaches the packages and their .sha256 files to that GitHub release. No secrets, signing
# identities, wallets or network services; the only credential is GITHUB_TOKEN for the upload.
name: Desktop packages

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: Release tag (vX.Y.Z...) whose GitHub release receives the packages.
        type: string
        required: true

permissions:
  contents: read

jobs:
  macos:
    name: Package macOS arm64
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm desktop:build
      - name: Package
        working-directory: apps/desktop
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$TAG" ]; then export GYBLOS_RELEASE_VERSION="${TAG#v}"; fi
          node --import tsx scripts/package.ts --target darwin-arm64
      - name: Smoke
        working-directory: apps/desktop/dist/packages/Gyblos-darwin-arm64
        run: perl -e 'alarm 120; exec @ARGV' ./Gyblos.app/Contents/MacOS/gyblos-desktop --smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-darwin-arm64
          path: apps/desktop/dist/release
          retention-days: 7
          if-no-files-found: error

  linux:
    name: Package Windows x64 and Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      # Also install the Windows native iroh binding, verified by the lockfile like every other package.
      - name: Include the Windows binding
        run: |
          cat >> pnpm-workspace.yaml <<'YAML'

          supportedArchitectures:
            os: [current, win32]
            cpu: [current, x64]
            libc: [current, glibc]
          YAML
      - run: pnpm install --frozen-lockfile
      - run: pnpm desktop:build
      - name: Package
        working-directory: apps/desktop
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$TAG" ]; then export GYBLOS_RELEASE_VERSION="${TAG#v}"; fi
          node --import tsx scripts/package.ts --target win32-x64
          node --import tsx scripts/package.ts --target linux-x64
      # Installs the .deb as a user would (which makes chrome-sandbox setuid) and starts it.
      - name: Smoke the .deb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb ./apps/desktop/dist/release/*.deb
          timeout 120 xvfb-run -a gyblos-desktop --smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-linux-x64
          path: apps/desktop/dist/release/*linux-x64*
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-win32-x64
          path: apps/desktop/dist/release/*win32-x64*
          retention-days: 7
          if-no-files-found: error

  windows:
    name: Smoke Windows x64
    needs: linux
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-win32-x64
          path: package
      - name: Smoke
        shell: pwsh
        run: |
          $zip = Get-ChildItem package -Filter *.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath app
          $exe = Get-ChildItem app -Recurse -Filter gyblos-desktop.exe | Select-Object -First 1
          $run = Start-Process -FilePath $exe.FullName -ArgumentList '--smoke' -Wait -PassThru
          if ($run.ExitCode -ne 0) { throw "Smoke failed with exit code $($run.ExitCode)" }

  publish:
    name: Attach to the release
    if: inputs.tag != ''
    needs: [macos, linux, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          path: release
          merge-multiple: true
      - name: Upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber
