name: PM21 global compatibility correction
on:
  push:
    branches: [codex/bench-installers-20261121-b]

permissions:
  contents: read

concurrency:
  group: pm21-global-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Whether a pull request touches more than the docs site; pushes to main always run everything.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      windows_full: ${{ steps.diff.outputs.windows_full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 8
      - name: Pin benchmark checkout
        shell: bash
        run: |
          git show HEAD:.pmbench/verify.py > "$RUNNER_TEMP/pmverify.py"
          git show HEAD:.pmbench/manifest > "$RUNNER_TEMP/pm-manifest"
          git show HEAD:.pmbench/lock > "$RUNNER_TEMP/pm-lock"
          git checkout --quiet --detach eeb52c526d5187ee0442e553ec11954806df93bc
          test "$(git rev-parse HEAD)" = eeb52c526d5187ee0442e553ec11954806df93bc
      - run: bash .github/scripts/test-ci-changes.sh
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          TARGET: ${{ github.base_ref }}
        run: |
          echo "code=true" >> "$GITHUB_OUTPUT"
          echo "windows_full=false" >> "$GITHUB_OUTPUT"

  # Formatting, the docs site and the tests that read its pages; every run.
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 8
      - name: Pin benchmark checkout
        shell: bash
        run: |
          git show HEAD:.pmbench/verify.py > "$RUNNER_TEMP/pmverify.py"
          git show HEAD:.pmbench/manifest > "$RUNNER_TEMP/pm-manifest"
          git show HEAD:.pmbench/lock > "$RUNNER_TEMP/pm-lock"
          git checkout --quiet --detach eeb52c526d5187ee0442e553ec11954806df93bc
          test "$(git rev-parse HEAD)" = eeb52c526d5187ee0442e553ec11954806df93bc
      # Version comes from the packageManager field in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The packaged seller's runtime (tooling/native-build.ts); its build test reuses this Node.
          node-version: 24.22.1
          package-manager-cache: false
      - name: Prepare isolated store
        shell: bash
        run: |
          echo "PM_STORE=${{ runner.os == 'Windows' && 'D:/pmstore21' || '/home/runner/pmstore21' }}" >> "$GITHUB_ENV"
          test ! -e "${{ runner.os == 'Windows' && 'D:/pmstore21' || '/home/runner/pmstore21' }}"
          test "$(node --version)" = v24.22.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.5
      - name: Stage frozen Bun inputs
        shell: bash
        run: |
          cp "$RUNNER_TEMP/pm-manifest" package.json
          cp "$RUNNER_TEMP/pm-lock" bun.lock
      - name: Restore dependency store
        if: github.event.head_commit.message != 'PM21 cold'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ runner.os == 'Windows' && 'D:/pmstore21' || '/home/runner/pmstore21' }}
          key: pm21-expB-${{ runner.os == 'Windows' && 'isolated' || 'global' }}-6b23cff2f3-${{ runner.os }}-${{ runner.arch }}
          fail-on-cache-miss: true
      - name: Frozen dependency install
        shell: bash
        run: |
          if [[ "$RUNNER_OS" = Windows ]]; then test ! -e "$PM_STORE/links"; fi
          BUN_INSTALL_CACHE_DIR="$PM_STORE" BUN_INSTALL_GLOBAL_STORE=1 bun install --frozen-lockfile --linker isolated
          git restore package.json
          rm bun.lock
      - name: Save cold dependency store
        if: github.event.head_commit.message == 'PM21 cold' && (github.job == 'docs' || github.job == 'windows')
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ runner.os == 'Windows' && 'D:/pmstore21' || '/home/runner/pmstore21' }}
          key: pm21-expB-${{ runner.os == 'Windows' && 'isolated' || 'global' }}-6b23cff2f3-${{ runner.os }}-${{ runner.arch }}
      - name: Verify patched SDK and native Iroh with Node
        if: github.job == 'docs' || github.job == 'windows'
        shell: bash
        run: |
          node --import tsx --test --test-reporter=tap tests/x402-batch-splits.test.ts tests/iroh-transport.test.ts | tee "$RUNNER_TEMP/pmcases.tap"
          grep -Eq '^# skipped 0' "$RUNNER_TEMP/pmcases.tap"
          grep -Eq '^# pass 10([^0-9]|$)' "$RUNNER_TEMP/pmcases.tap"
          python "$RUNNER_TEMP/pmverify.py"
          node -e "const f=require('node:fs');const p='node_modules/.bun';console.log('shared package links',f.readdirSync(p).filter(x=>f.lstatSync(p+'/'+x).isSymbolicLink()).length)"
      - run: pnpm exec prettier --check .
      - run: pnpm --filter @gyblos/docs exec next build --webpack
      - run: pnpm docs:test
      - run: node --import tsx --test "tests/docs-*.test.ts"

