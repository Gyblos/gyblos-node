        shell: bash
        run: |
          echo "PM_STORE=${{ runner.os == 'Windows' && 'D:/pmstore21' || '/home/runner/pmstore21' }}" >> "$GITHUB_ENV"
          test ! -e "${{ runner.os == 'Windows' && 'D:/pmstore21' || '/home/runner/pmstore21' }}"
          test "$(node --version)" = v24.22.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.5
      - name: Stage frozen Bun inputs
        shell: bash
        run: |
          cp "$RUNNER_TEMP/pm-manifest" package.json
          cp "$RUNNER_TEMP/pm-lock" bun.lock
      - name: Restore dependency store
        if: github.event.head_commit.message != 'PM21 cold'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ runner.os == 'Windows' && 'D:/pmstore21' || '/home/runner/pmstore21' }}
          key: pm21-expB-${{ runner.os == 'Windows' && 'isolated' || 'global' }}-6b23cff2f3-${{ runner.os }}-${{ runner.arch }}
          fail-on-cache-miss: true
      - name: Frozen dependency install
        shell: bash
        run: |
          if [[ "$RUNNER_OS" = Windows ]]; then test ! -e "$PM_STORE/links"; fi
          BUN_INSTALL_CACHE_DIR="$PM_STORE" BUN_INSTALL_GLOBAL_STORE=1 bun install --frozen-lockfile --linker isolated
          git restore package.json
          rm bun.lock
      - name: Save cold dependency store
        if: github.event.head_commit.message == 'PM21 cold' && (github.job == 'docs' || github.job == 'windows')
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ runner.os == 'Windows' && 'D:/pmstore21' || '/home/runner/pmstore21' }}
          key: pm21-expB-${{ runner.os == 'Windows' && 'isolated' || 'global' }}-6b23cff2f3-${{ runner.os }}-${{ runner.arch }}
      - name: Verify patched SDK and native Iroh with Node
        if: github.job == 'docs' || github.job == 'windows'
        shell: bash
        run: |
          node --import tsx --test --test-reporter=tap tests/x402-batch-splits.test.ts tests/iroh-transport.test.ts | tee "$RUNNER_TEMP/pmcases.tap"
          grep -Eq '^# skipped 0' "$RUNNER_TEMP/pmcases.tap"
          grep -Eq '^# pass 10([^0-9]|$)' "$RUNNER_TEMP/pmcases.tap"
          python "$RUNNER_TEMP/pmverify.py"
          node -e "const f=require('node:fs');const p='node_modules/.bun';console.log('shared package links',f.readdirSync(p).filter(x=>f.lstatSync(p+'/'+x).isSymbolicLink()).length)"
      - run: pnpm build:native --version 0.0.0-ci.1 --target win32-x64 --out dist/windows
      - run: pnpm build:npm --version 0.0.0-ci.1 --target win32-x64 --archives dist/windows --out dist/windows
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-package
          path: dist/windows
          retention-days: 1
          if-no-files-found: error

  # The seller on Windows (#235): private files and keys protected by the folder ACL, setup, init and
  # doctor, the packaged seller from its archive and from npm, its service and installer, and the
  # running daemon. Windows runners bill at twice Linux, so
  # only the Windows-specific tests run here.
  windows:
    needs: [changes, windows-package]
    if: >-
      !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.code == 'true' &&
      ((needs.changes.outputs.windows_full == 'true' && needs.windows-package.result == 'success') ||
      (needs.changes.outputs.windows_full == 'false' && needs.windows-package.result == 'skipped'))
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 8
      - name: Pin benchmark checkout
        shell: bash
        run: |
          git show HEAD:.pmbench/verify.py > "$RUNNER_TEMP/pmverify.py"
          git show HEAD:.pmbench/manifest > "$RUNNER_TEMP/pm-manifest"
          git show HEAD:.pmbench/lock > "$RUNNER_TEMP/pm-lock"
          git checkout --quiet --detach eeb52c526d5187ee0442e553ec11954806df93bc
          test "$(git rev-parse HEAD)" = eeb52c526d5187ee0442e553ec11954806df93bc
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Prepare isolated store
        shell: bash
        run: |
          echo "PM_STORE=${{ runner.os == 'Windows' && 'D:/pmstore21' || '/home/runner/pmstore21' }}" >> "$GITHUB_ENV"
          test ! -e "${{ runner.os == 'Windows' && 'D:/pmstore21' || '/home/runner/pmstore21' }}"
          test "$(node --version)" = v24.22.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.5
      - name: Stage frozen Bun inputs
        shell: bash
        run: |
          cp "$RUNNER_TEMP/pm-manifest" package.json
          cp "$RUNNER_TEMP/pm-lock" bun.lock
      - name: Restore dependency store
        if: github.event.head_commit.message != 'PM21 cold'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ runner.os == 'Windows' && 'D:/pmstore21' || '/home/runner/pmstore21' }}
          key: pm21-expB-${{ runner.os == 'Windows' && 'isolated' || 'global' }}-6b23cff2f3-${{ runner.os }}-${{ runner.arch }}
          fail-on-cache-miss: true
      - name: Frozen dependency install
        shell: bash
        run: |
          if [[ "$RUNNER_OS" = Windows ]]; then test ! -e "$PM_STORE/links"; fi
          BUN_INSTALL_CACHE_DIR="$PM_STORE" BUN_INSTALL_GLOBAL_STORE=1 bun install --frozen-lockfile --linker isolated
          git restore package.json
          rm bun.lock
      - name: Save cold dependency store
        if: github.event.head_commit.message == 'PM21 cold' && (github.job == 'docs' || github.job == 'windows')
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ runner.os == 'Windows' && 'D:/pmstore21' || '/home/runner/pmstore21' }}
          key: pm21-expB-${{ runner.os == 'Windows' && 'isolated' || 'global' }}-6b23cff2f3-${{ runner.os }}-${{ runner.arch }}
      - name: Verify patched SDK and native Iroh with Node
        if: github.job == 'docs' || github.job == 'windows'
        shell: bash
        run: |
          node --import tsx --test --test-reporter=tap tests/x402-batch-splits.test.ts tests/iroh-transport.test.ts | tee "$RUNNER_TEMP/pmcases.tap"
          grep -Eq '^# skipped 0' "$RUNNER_TEMP/pmcases.tap"
          grep -Eq '^# pass 10([^0-9]|$)' "$RUNNER_TEMP/pmcases.tap"
          python "$RUNNER_TEMP/pmverify.py"
          node -e "const f=require('node:fs');const p='node_modules/.bun';console.log('shared package links',f.readdirSync(p).filter(x=>f.lstatSync(p+'/'+x).isSymbolicLink()).length)"
      - name: Desktop seller selection and channel chat
        run: node --import tsx --test tests/desktop-network-catalog-paid.test.ts tests/desktop-buyer-stream-loopback.test.ts
      - if: needs.changes.outputs.windows_full == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-package
          path: ${{ runner.temp }}/windows-package
      - if: needs.changes.outputs.windows_full == 'false'
        run: node --import tsx --test tests/windows-acl.test.ts tests/windows-seller.test.ts tests/windows-service.test.ts
      - if: needs.changes.outputs.windows_full == 'true'
        run: node --import tsx --test tests/windows-acl.test.ts tests/windows-seller.test.ts tests/windows-package.test.ts tests/windows-service.test.ts tests/windows-task.test.ts tests/windows-install.test.ts
        env:
          GYBLOS_WINDOWS_PACKAGE: ${{ runner.temp }}/windows-package
          GYBLOS_WINDOWS_VERSION: 0.0.0-ci.1
      # The running seller on Windows: the real daemon over native loopback with a synthetic engine, its
      # files, and the free transport. No network or devnet. The buyer-side lab acceptance joins once the
      # buyer's own files work on Windows.
      - run: node --import tsx --test tests/lab/seller-daemon-files.test.ts tests/free-execution-iroh.test.ts tests/iroh-transport.test.ts tests/node-startup-failure.test.ts

  # One result for the whole run: fails when any part failed or was cancelled; parts skipped for a
  # docs-only change count as passed.
  check:
    if: always()
    needs: [changes, docs, static, test, lab, build, windows-package, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          CODE: ${{ needs.changes.outputs.code }}
          FULL: ${{ needs.changes.outputs.windows_full }}
          WINDOWS: ${{ needs.windows.result }}
          PACKAGE: ${{ needs.windows-package.result }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          case "$CODE/$FULL/$WINDOWS/$PACKAGE" in
            true/true/success/success | true/false/success/skipped | false/false/skipped/skipped) ;;
            *) echo "Unexpected Windows check results"; exit 1 ;;
          esac
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) echo "A CI part ended with: $result"; exit 1 ;;
            esac
          done
