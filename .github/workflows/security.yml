# Read-only scans of PR snapshots. No pull_request_target, repository secrets,
# persistent checkout credentials, deployment or automatic dependency fixes.
name: Security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          echo "$GITLEAKS_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
      # The private pre-opening review inventories all reachable history. CI scans
      # every commit introduced by this change, without suppressions or baselines.
      - name: Scan introduced commits with default rules and full redaction
        env:
          SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          [[ "$SCAN_BASE" =~ ^[0-9a-f]{40}$ ]]
          git rev-parse --verify "${SCAN_BASE}^{commit}"
          # Gitleaks also reads a source-root ignore file despite an explicit path.
          if [[ -e .gitleaksignore || -L .gitleaksignore ]]; then
            echo 'Repository Gitleaks ignore files are not permitted.' >&2
            exit 1
          fi
          mkdir "$RUNNER_TEMP/gitleaks-ignore"
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/gitleaks-default.toml"
          "$RUNNER_TEMP/gitleaks" git . --log-opts="${SCAN_BASE}..HEAD" \
            --config "$RUNNER_TEMP/gitleaks-default.toml" \
            --gitleaks-ignore-path "$RUNNER_TEMP/gitleaks-ignore" \
            --ignore-gitleaks-allow --redact=100 --no-banner --no-color --timeout 300
  dependencies:
    name: Dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Read the lockfile; do not install or execute dependency lifecycle scripts.
      - run: pnpm audit --audit-level high
