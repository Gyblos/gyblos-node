# Cross-platform desktop wallet contracts, build and portable backup exchange on
# Linux, Windows and macOS. Manual only (Actions > Desktop platforms > Run workflow):
# macOS and Windows runners bill 10x and 2x the minutes. Run it before any desktop
# distribution and after changes to the wallet, backup or restore code.
# No secrets, funded wallets, engines, devnet RPC or deployment.
name: Desktop platforms

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-platforms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wallet:
    name: Wallet contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Disposable keys and fake OS encryption only, not native keystore proof.
      - run: pnpm exec tsx --test tests/desktop-wallet.test.ts tests/desktop-wallet-lifecycle.test.ts tests/desktop-wallet-protection.test.ts tests/desktop-startup.test.ts tests/desktop-startup-window.test.ts tests/desktop-session-cleanup.test.ts
      - run: pnpm exec tsx --test tests/desktop-wallet-backup.test.ts tests/desktop-backup-recovery.test.ts tests/desktop-backup-flow.test.ts tests/desktop-wallet-restore.test.ts tests/desktop-wallet-restore-files.test.ts tests/desktop-wallet-setup.test.ts tests/desktop-wallet-setup-lifecycle.test.ts tests/desktop-wallet-setup-regressions.test.ts tests/desktop-backup-verification.test.ts tests/desktop-backup-verification-pkcs8.test.ts tests/desktop-wallet-library.test.ts tests/desktop-wallet-library-interruption.test.ts tests/desktop-wallet-active-backup.test.ts tests/desktop-wallet-session.test.ts tests/desktop-wallet-settings-boundary.test.ts tests/desktop-wallet-session-reads.test.ts
      - run: pnpm desktop:build
      # Only encrypted generated-key fixtures and public expected addresses.
      - run: pnpm exec tsx tooling/desktop-backup-exchange.ts produce .local/portable-exchange
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portable-backup-${{ matrix.os }}
          path: |
            .local/portable-exchange/backup.json
            .local/portable-exchange/public.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
  backup-exchange:
    name: Backup exchange (${{ matrix.os }})
    needs: wallet
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: portable-backup-*
          path: .local/portable-exchange
      - run: pnpm exec tsx tooling/desktop-backup-exchange.ts consume .local/portable-exchange
