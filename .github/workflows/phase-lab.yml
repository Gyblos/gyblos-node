name: Profile two native lab cases
on:
  push:
    branches: ['codex/profile-free-tools-19-*']
permissions:
  contents: read
jobs:
  lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node .github/phase-bench/instrument.mjs
      - name: Run lab (1) with timing probes
        run: |
          export GYB_PHASE_DIR="$(mktemp -d)"
          node --import tsx --test --test-shard=1/2 "tests/lab/**/*.test.ts" > "$GYB_PHASE_DIR/spec.log" 2>&1
          python3 .github/phase-bench/report.py "$GYB_PHASE_DIR"
