# Trusted metadata-only handling invalidates labels before a new PR revision is reviewed.
name: AI review state
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  issues: write
  pull-requests: read
concurrency:
  group: ai-review-state-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  invalidate:
    if: vars.AI_REVIEW_ENABLED == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Invalidate previous PR revision labels without checking out source
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REQUEST_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          const repo = process.env.GITHUB_REPOSITORY;
          const number = process.env.PR_NUMBER;
          if (!/^[1-9][0-9]*$/.test(number)) throw new Error('Invalid PR identity.');
          const api = (...args) => execFileSync('gh', ['api', ...args], {encoding:'utf8'});
          const pr = JSON.parse(api('repos/' + repo + '/pulls/' + number));
          if (pr.state !== 'open' || pr.base.ref !== 'main' ||
              pr.head.repo?.full_name !== repo || pr.head.sha !== process.env.REQUEST_HEAD) process.exit(0);
          const labels = JSON.parse(api('repos/' + repo + '/issues/' + number + '/labels'));
          for (const item of labels) {
            if (/^ai-review:(queued|running|clean|needs-validation|error)$/.test(item.name))
              api('-X', 'DELETE', 'repos/' + repo + '/issues/' + number + '/labels/' + encodeURIComponent(item.name));
          }
          api('-X', 'POST', 'repos/' + repo + '/issues/' + number + '/labels', '-f', 'labels[]=ai-review:queued');
          NODE
