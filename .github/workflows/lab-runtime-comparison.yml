name: PR lab runtime comparison
on:
  push:
    branches: [codex/pr-lab-bun-comparison-n18]
permissions:
  contents: read
jobs:
  lab:
    name: lab (1) / ${{ matrix.runtime }} / ${{ matrix.rep }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runtime: [node, bun]
        rep: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1
          cache: pnpm
      - if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - run: pnpm install --frozen-lockfile
      - name: Run PR lab shard on Node
        if: matrix.runtime == 'node'
        run: node --import tsx --test --test-shard=1/2 "tests/lab/**/*.test.ts"
      - name: Run identical shard files on Bun
        if: matrix.runtime == 'bun'
        run: |
          node --input-type=module -e "import {globSync} from 'node:fs'; console.log(JSON.stringify(globSync('tests/lab/**/*.test.ts').sort().filter((_, i) => i % 2 === 0)))" > "$RUNNER_TEMP/shard.json"
          export WORKERS=$(node -p "Math.max(1,require('node:os').availableParallelism()-1)")
          python .github/bench-lab-bun.py
