# Releases the seller when a version tag (v0.1.0-beta.3) on main is pushed. The `release` job, in the
# `release` environment so it waits for a maintainer's approval, runs scripts/release-image.sh: it
# builds amd64 and arm64, pushes ghcr.io/gyblos/seller and signs the digest keyless with this workflow's
# GitHub identity (the identity install.sh verifies). The `native` job then runs
# scripts/release-native.sh: it builds the packaged sellers (no Docker) for macOS arm64 and Linux and
# signs each archive with the same identity. The `publish` job runs scripts/publish-installer.sh: it signs
# an install.sh pinned to that digest and to those archives' checksums and attaches them all to the
# GitHub release of the tag; a release newer than the latest becomes latest, which
# https://gyblos.com/install.sh serves, and moves `beta`. Nothing is committed and nothing else is
# deployed. The only credential is each run's GITHUB_TOKEN. Push one release tag at a time: a newer
# pending run replaces an older pending one. If only `publish` fails, re-run that failed job.
name: Release seller image

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

concurrency:
  group: release-seller-image
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      pinned: ${{ steps.release.outputs.pinned }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: Log in to the GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build, push and sign
        id: release
        run: sh scripts/release-image.sh "${GITHUB_REF_NAME#v}"

  native:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    outputs:
      native: ${{ steps.native.outputs.native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # No dependency cache in a signing job: every input comes from the lockfile and pinned checksums.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - run: pnpm install --frozen-lockfile
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: Build and sign the packaged sellers
        id: native
        run: sh scripts/release-native.sh "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native
          path: dist/native
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: [release, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: Log in to the GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native
          path: dist/native
      - name: Sign the installer and create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PINNED: ${{ needs.release.outputs.pinned }}
          NATIVE_PINS: ${{ needs.native.outputs.native }}
          NATIVE_DIR: dist/native
        run: sh scripts/publish-installer.sh "$PINNED"
