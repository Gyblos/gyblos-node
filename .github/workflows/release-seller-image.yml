# Releases the seller image when a version tag (v0.1.0-beta.1) on main is pushed: scripts/release-image.sh
# builds amd64 and arm64, pushes ghcr.io/gyblos/seller, signs the digest keyless with this workflow's
# GitHub identity (the identity install.sh verifies) and pins install.sh; this workflow then opens the
# pull request with that pin. The installer reaches sellers when that pull request is merged and the
# docs site is deployed. The only credential is this run's GITHUB_TOKEN.
name: Release seller image

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

concurrency:
  group: release-seller-image
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: Log in to the GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build, push and sign
        run: sh scripts/release-image.sh "${GITHUB_REF_NAME#v}"
      - name: Open the pull request that pins install.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          branch="release/seller-$version"
          gh auth setup-git
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add install.sh
          git commit -m "install.sh: pin the seller image $version [skip ci]"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "install.sh: pin the seller image $version" \
            --body "Pins install.sh to the signed seller image $version released by run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Merge it, then deploy the docs site so https://gyblos.com/install.sh serves this release."
