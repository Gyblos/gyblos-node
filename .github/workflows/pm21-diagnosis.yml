name: PM21 Windows diagnosis
on:
  push:
    branches: [codex/bench-installers-20261121-b]
permissions:
  contents: read
jobs:
  diagnosis:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 8
      - name: Pin benchmark checkout
        shell: bash
        run: |
          git show HEAD:.pmbench/verify.py > "$RUNNER_TEMP/pmverify.py"
          git show HEAD:.pmbench/manifest > "$RUNNER_TEMP/pm-manifest"
          git show HEAD:.pmbench/lock > "$RUNNER_TEMP/pm-lock"
          git checkout --quiet --detach 6b23cff2f3aa802f4c3512ed1881bd18425b6d28
          test "$(git rev-parse HEAD)" = 6b23cff2f3aa802f4c3512ed1881bd18425b6d28
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Prepare isolated store
        shell: bash
        run: |
          echo "PM_STORE=${{ runner.os == 'Windows' && 'D:/pmstore21' || '/home/runner/pmstore21' }}" >> "$GITHUB_ENV"
          test ! -e "${{ runner.os == 'Windows' && 'D:/pmstore21' || '/home/runner/pmstore21' }}"
          test "$(node --version)" = v24.22.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.5
      - name: Stage frozen Bun inputs
        shell: bash
        run: |
          cp "$RUNNER_TEMP/pm-manifest" package.json
          cp "$RUNNER_TEMP/pm-lock" bun.lock
      - name: Restore dependency store
        if: success()
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ runner.os == 'Windows' && 'D:/pmstore21' || '/home/runner/pmstore21' }}
          key: pm21-expB-global-6b23cff2f3-${{ runner.os }}-${{ runner.arch }}
          fail-on-cache-miss: true
      - name: Frozen dependency install
        shell: bash
        run: |
          BUN_INSTALL_CACHE_DIR="$PM_STORE" BUN_INSTALL_GLOBAL_STORE=1 bun install --frozen-lockfile --linker isolated
          git restore package.json
          rm bun.lock
      - name: Save cold dependency store
        if: github.event.head_commit.message == 'PM21 cold' && (github.job == 'docs' || github.job == 'windows')
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ runner.os == 'Windows' && 'D:/pmstore21' || '/home/runner/pmstore21' }}
          key: pm21-expB-global-6b23cff2f3-${{ runner.os }}-${{ runner.arch }}
      - name: Verify content of all patched files independently
        shell: bash
        run: python "$RUNNER_TEMP/pmverify.py"
      - name: Open and close a native Iroh loopback endpoint
        if: always()
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { Endpoint, RelayMode } from '@number0/iroh';
          const b = Endpoint.builder();
          b.applyMinimal();
          b.relayMode(RelayMode.disabled());
          b.bindAddr('127.0.0.1:0');
          const e = await b.bind();
          await e.close();
          if (!e.isClosed()) throw Error('close');
          console.log('Native Iroh: loopback bind and close succeeded');
          JS
      - name: Inspect restored Solana dependency
        if: always()
        shell: bash
        run: |
          python - <<'PYDIAG'
          import pathlib,os
          store=pathlib.Path('D:/pmstore21/links')
          for p in store.glob('@solana+accounts@*/node_modules/@solana/errors'):
           print('entry',p.name,'exists',p.exists(),'link',p.is_symlink(),'junction',getattr(p,'is_junction',lambda:False)())
          print('error package entries in store',len(list(store.glob('@solana+errors@*'))))
          PYDIAG
