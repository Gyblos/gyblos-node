name: CurrentLab22Fix canary
permissions:
  contents: read
concurrency:
  group: currentlab22fix-canary-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      windows_full: ${{ steps.diff.outputs.windows_full }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
        ref: ae48686907b2e72c021c083e3842fb0c86bd18d2
    - run: bash .github/scripts/test-ci-changes.sh
    - id: diff
      env:
        EVENT: ${{ github.event_name }}
        BASE: ${{ github.event.pull_request.base.sha }}
        TARGET: ${{ github.base_ref }}
      run: printf 'code=true\nwindows_full=false\n' >> "$GITHUB_OUTPUT"
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
        ref: ae48686907b2e72c021c083e3842fb0c86bd18d2
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24.22.1
        cache: pnpm
    - run: pnpm install --frozen-lockfile
    - run: pnpm comments:check
      env:
        COMMENT_BASE_SHA: c8f50c2e5d39bdcfc3f0e6ee71ef5bbac32ed82b
    - run: pnpm exec prettier --check .
    - run: pnpm docs:build
    - run: pnpm docs:test
    - run: node --import tsx --test "tests/docs-*.test.ts"
  static:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
        ref: ae48686907b2e72c021c083e3842fb0c86bd18d2
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24.22.1
        cache: pnpm
    - run: pnpm install --frozen-lockfile
    - run: pnpm typecheck
    - run: pnpm lint
      env:
        COMMENT_BASE_SHA: c8f50c2e5d39bdcfc3f0e6ee71ef5bbac32ed82b
  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard:
        - 1
        - 2
        - 3
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ae48686907b2e72c021c083e3842fb0c86bd18d2
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24.22.1
        cache: pnpm
    - run: pnpm install --frozen-lockfile
    - run: node --import tsx tooling/ci-shards-cli.ts ${{ matrix.shard }}/3 "tests/*.test.ts" "packages/*/test/**/*.test.ts"
  lab:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard:
        - 1
        - 2
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ae48686907b2e72c021c083e3842fb0c86bd18d2
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24.22.1
        cache: pnpm
    - run: pnpm install --frozen-lockfile
    - if: matrix.shard == 1
      name: Select ordinary lab files and load identical test fixtures
      run: 'echo '''' | base64 -d > "$RUNNER_TEMP/fixture.patch"

        git apply "$RUNNER_TEMP/fixture.patch"

        node --input-type=module -e "import {assignShards} from ''./tooling/ci-shards.ts''; import {globSync,readFileSync} from ''node:fs''; console.log(JSON.stringify(assignShards(globSync(''tests/lab/**/*.test.ts''),new Map(Object.entries(JSON.parse(readFileSync(''tooling/ci-shard-durations.json'')))),2,true)[0]))" > "$RUNNER_TEMP/shard.json"

        cat "$RUNNER_TEMP/shard.json" '
    - if: matrix.shard == 1
      name: Install pinned Bun canary
      working-directory: ${{ runner.temp }}
      run: 'curl -fsSL --retry 3 -o bun.tgz https://registry.npmjs.org/@oven/bun-linux-x64/-/bun-linux-x64-1.4.5-canary.20261122.1.tgz

        echo ''4580f353f7de5a9870692a845b7f06b7ce54c7c8ffc9965fd75debf75d648b123cc450b42a197704115e1d587f49687b168c8794b724baacb3046b2c897039f2  bun.tgz'' | sha512sum -c -

        tar -xzf bun.tgz package/bin/bun

        package/bin/bun --revision

        echo "$RUNNER_TEMP/package/bin" >> "$GITHUB_PATH" '
    - if: matrix.shard == 1
      name: Run selected files with Bun canary
      run: 'echo '''' | base64 -d > "$RUNNER_TEMP/bench.py"

        export WORKERS=$(node -p "Math.max(1,require(''node:os'').availableParallelism()-1)")

        python3 "$RUNNER_TEMP/bench.py"'
    - run: node --import tsx tooling/ci-shards-cli.ts ${{ matrix.shard }}/2 "tests/lab/**/*.test.ts"
      env:
        ORDINARY_LAB_PR: ${{ needs.changes.outputs.windows_full == 'false' }}
      if: matrix.shard != 1
  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ae48686907b2e72c021c083e3842fb0c86bd18d2
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24.22.1
        cache: pnpm
    - run: pnpm install --frozen-lockfile
    - run: pnpm desktop:build
    - name: Build the packaged seller for linux-x64
      run: 'pnpm build:native --version 0.0.0-ci.1 --target linux-x64 --out "$RUNNER_TEMP/native"

        tar -xzf "$RUNNER_TEMP/native/gyblos-0.0.0-ci.1-linux-x64.tar.gz" -C "$RUNNER_TEMP"

        test "$("$RUNNER_TEMP/gyblos-0.0.0-ci.1-linux-x64/bin/gyblos" --version)" = 0.0.0-ci.1

        '
  windows-package:
    needs: changes
    if: needs.changes.outputs.windows_full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ae48686907b2e72c021c083e3842fb0c86bd18d2
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24.22.1
        cache: pnpm
    - run: pnpm install --frozen-lockfile
    - run: pnpm build:native --version 0.0.0-ci.1 --target win32-x64 --out dist/windows
    - run: pnpm build:npm --version 0.0.0-ci.1 --target win32-x64 --archives dist/windows --out dist/windows
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: windows-package
        path: dist/windows
        retention-days: 1
        if-no-files-found: error
  windows:
    needs:
    - changes
    - windows-package
    if: '!cancelled() && needs.changes.result == ''success'' && needs.changes.outputs.code == ''true'' && ((needs.changes.outputs.windows_full == ''true'' && needs.windows-package.result == ''success'') || (needs.changes.outputs.windows_full == ''false'' && needs.windows-package.result == ''skipped''))'
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ae48686907b2e72c021c083e3842fb0c86bd18d2
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24.22.1
        cache: pnpm
    - run: pnpm install --frozen-lockfile
    - name: Desktop seller selection and channel chat
      run: node --import tsx --test tests/desktop-network-catalog-paid.test.ts tests/desktop-buyer-stream-loopback.test.ts
    - if: needs.changes.outputs.windows_full == 'true'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: windows-package
        path: ${{ runner.temp }}/windows-package
    - if: needs.changes.outputs.windows_full == 'false'
      run: node --import tsx --test tests/windows-acl.test.ts tests/windows-seller.test.ts tests/windows-service.test.ts
    - if: needs.changes.outputs.windows_full == 'true'
      run: node --import tsx --test tests/windows-acl.test.ts tests/windows-seller.test.ts tests/windows-package.test.ts tests/windows-service.test.ts tests/windows-task.test.ts tests/windows-install.test.ts
      env:
        GYBLOS_WINDOWS_PACKAGE: ${{ runner.temp }}/windows-package
        GYBLOS_WINDOWS_VERSION: 0.0.0-ci.1
    - run: node --import tsx --test tests/lab/seller-daemon-files.test.ts tests/free-execution-iroh.test.ts tests/iroh-transport.test.ts tests/node-startup-failure.test.ts
  check:
    if: always()
    needs:
    - changes
    - docs
    - static
    - test
    - lab
    - build
    - windows-package
    - windows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - env:
        CODE: ${{ needs.changes.outputs.code }}
        FULL: ${{ needs.changes.outputs.windows_full }}
        WINDOWS: ${{ needs.windows.result }}
        PACKAGE: ${{ needs.windows-package.result }}
        RESULTS: ${{ join(needs.*.result, ' ') }}
      run: "case \"$CODE/$FULL/$WINDOWS/$PACKAGE\" in\n  true/true/success/success | true/false/success/skipped | false/false/skipped/skipped) ;;\n  *) echo \"Unexpected Windows check results\"; exit 1 ;;\nesac\nfor result in $RESULTS; do\n  case \"$result\" in\n    success | skipped) ;;\n    *) echo \"A CI part ended with: $result\"; exit 1 ;;\n  esac\ndone\n"
'on':
  push:
    branches:
    - codex/bench-pr-canary-lab1-fixture-n22
